services:
  - type: web
    name: tv-digital-pro-demo-al2rm
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend && npm ci --prefix admin --include=dev && npm run build --prefix admin
    startCommand: npm run db:migrate --prefix backend && npm run admin:create --prefix backend && npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: XTREAM_CREDENTIALS_KEY
        generateValue: true
      - key: SERVE_ADMIN
        value: "true"
      - key: VITE_API_URL
        value: /api
      - key: ALLOW_HTTP_STREAMS
        value: "true"
      - key: WHATSAPP_MODE
        value: assisted
      - key: WHATSAPP_DEFAULT_COUNTRY_CODE
        value: "595"
      - key: AUTOMATION_WORKER_ENABLED
        value: "false"
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_EMAIL
        value: admin@tv-digital.local
      - key: ADMIN_PASSWORD
        generateValue: true
