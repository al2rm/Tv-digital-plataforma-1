name: Compilar prueba estilo Lumix

on:
  push:
    branches: [codex/lumix-safe-trial]
    paths: [lumix-safe-trial.patch]

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar cambios de la prueba
        run: |
          git apply --exclude=README.md lumix-safe-trial.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin android backend
          git commit -m "Agrega prueba estilo Lumix con diagnóstico Xtream"
          git push
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar SDK Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Probar y compilar APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Digital-Pro-Lumix-Prueba
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
