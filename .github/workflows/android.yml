name: Compilar app Android
on:
  push:
    branches: [main, codex/android-panel-integrado]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar diseño Android TV autorizado
        run: git apply tv-android.patch
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verificar y compilar APK de prueba
        working-directory: android
        run: >-
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
          -PBACKEND_BASE_URL=https://tv-digital-pro-demo-al2rm.onrender.com/
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Digital-Pro-Android-TV-1.3.0-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-reportes
          path: android/app/build/reports/
