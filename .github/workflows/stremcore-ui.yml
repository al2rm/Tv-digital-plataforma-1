name: Verificar interfaz Stremcore
on:
  pull_request:
    paths: ['admin/**', '.github/workflows/stremcore-ui.yml']
  push:
    branches: [main]
    paths: ['admin/**', '.github/workflows/stremcore-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stremcore-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --prefix admin
      - run: npm ci --prefix backend
      - run: npm run build --prefix admin
      - name: Preparar navegador de pruebas
        run: |
          npm install --prefix "$RUNNER_TEMP/stremcore-ui" --no-audit --no-fund --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/stremcore-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Probar interfaz con datos ficticios
        env:
          PLAYWRIGHT_NODE_MODULES: ${{ runner.temp }}/stremcore-ui/node_modules
        run: |
          NODE_ENV=test SERVE_ADMIN=true JWT_SECRET=clave-exclusiva-para-pruebas-de-interfaz node --input-type=module -e 'import app from "./backend/src/app.js"; app.listen(4173,"127.0.0.1");' > "$RUNNER_TEMP/stremcore-preview.log" 2>&1 &
          node admin/smoke/stremcore-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Stremcore-interfaz
          path: admin/ui-reports/
          retention-days: 7
